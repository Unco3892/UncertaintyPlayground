name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - ci_run*
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10','3.11','3.12']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: uncertaintyplayground/requirements.txt
    - name: Install dependencies
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 45
        max_attempts: 3
        shell: bash
        command: |
          python -m pip install --upgrade pip
          pip install -r uncertaintyplayground/requirements.txt
    - name: Run tests
      run: |
        python -m unittest discover -s uncertaintyplayground/tests

  deploy-to-pypi:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build twine
    - name: Check if version exists
      id: check_version
      shell: bash
      run: |
        VERSION=$(python setup.py --version)
        echo "Local version: $VERSION"
        if curl -sf "https://pypi.org/pypi/UncertaintyPlayground/$VERSION/json" > /dev/null; then
          echo "Version $VERSION is already on PyPI, skipping upload"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "Version $VERSION is new, will upload"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Build and publish
      if: steps.check_version.outputs.exists == 'false'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m build
        twine check dist/*
        twine upload dist/*
